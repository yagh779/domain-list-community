name: Build dlc.dat

# Produces the minimal dlc.dat consumed by yagh779/sing-geosite.
#
# Only two entries are shipped, each trimmed to just the domains that feed a
# sing-geosite tag:
#   - "cn"             : the data/cn-overseas overlay (domains tagged @!cn)
#                        => tag cn@!cn
#   - "geolocation-!cn": upstream v2fly geolocation-!cn, only domains tagged
#                        @cn => tag geolocation-!cn@cn
# No other domain is built.
#
# A rebuild only happens when the data that actually feeds sing-geosite's two
# tags changed:
#   - geolocation-!cn@cn : compared against the upstream v2fly dlc.dat
#   - cn@!cn             : data/cn-overseas, kept in sync with
#                          nekolsd/domain-list-community cn@!cn
# If neither changed, the job stops before building anything.

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Force a rebuild even if no data changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-dlc-dat
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download source dlc.dat files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .work/v2fly .work/nekolsd
          gh release download --repo v2fly/domain-list-community --pattern dlc.dat -D .work/v2fly --clobber
          gh release download --repo nekolsd/domain-list-community --pattern dlc.dat -D .work/nekolsd --clobber

      - name: Detect data changes
        id: detect
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          go build -o .work/sync ./cmd/sync
          GEO="$(.work/sync hashtag .work/v2fly/dlc.dat 'geolocation-!cn@cn' 2>/dev/null)"
          CN="$(.work/sync hashtag .work/nekolsd/dlc.dat 'cn@!cn' 2>/dev/null)"
          PREV_GEO="$(jq -r '."geolocation-!cn@cn" // empty' sync-state.json)"
          PREV_CN="$(jq -r '."cn@!cn" // empty' sync-state.json)"
          GEO_CHANGED=false
          CN_CHANGED=false
          if [ "$GEO" != "$PREV_GEO" ]; then GEO_CHANGED=true; fi
          if [ "$CN" != "$PREV_CN" ]; then CN_CHANGED=true; fi
          if [ "$FORCE" = "true" ]; then GEO_CHANGED=true; CN_CHANGED=true; fi
          echo "geo=$GEO" >> "$GITHUB_OUTPUT"
          echo "cn=$CN" >> "$GITHUB_OUTPUT"
          echo "geo_changed=$GEO_CHANGED" >> "$GITHUB_OUTPUT"
          echo "cn_changed=$CN_CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$GEO_CHANGED" = "true" ] || [ "$CN_CHANGED" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Data changed (geo_changed=$GEO_CHANGED cn_changed=$CN_CHANGED): will build."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No data change: skip build."
          fi

      - name: Update data/cn-overseas from nekolsd
        if: steps.detect.outputs.cn_changed == 'true'
        run: .work/sync extract-cn-overseas .work/nekolsd/dlc.dat data/cn-overseas

      - name: Repackage minimal dlc.dat
        if: steps.detect.outputs.build == 'true'
        run: |
          set -euo pipefail
          go build -o .work/build ./cmd/build
          rm -rf dist && mkdir -p dist
          .work/build .work/v2fly/dlc.dat data/cn-overseas dist/dlc.dat
          ( cd dist && sha256sum dlc.dat > dlc.dat.sha256sum && cat dlc.dat.sha256sum )

      - name: Commit updated sync state
        if: steps.detect.outputs.build == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          jq -n --arg geo "${{ steps.detect.outputs.geo }}" --arg cn "${{ steps.detect.outputs.cn }}" \
            '{ "cn@!cn": $cn, "geolocation-!cn@cn": $geo }' > sync-state.json
          git add sync-state.json data/cn-overseas
          if git diff --cached --quiet; then
            echo "No tracked data change to commit."
          else
            git commit -m "chore: sync cn-overseas and geolocation-!cn data"
            git push origin master
          fi

      - name: Publish release
        if: steps.detect.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(date -u +%Y%m%d%H%M%S)"
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes "dlc.dat built from v2fly data with the cn-overseas overlay (entries: cn, geolocation-!cn)" \
            --latest \
            dist/dlc.dat dist/dlc.dat.sha256sum
          echo "Released $TAG"
