name: Sync upstream

# Keep this fork's data in sync with v2fly/domain-list-community so the
# generated lists (including the injected cn-overseas overlay) follow
# upstream updates. Runs before sing-geosite's daily build (00:00 UTC).

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Merge v2fly/domain-list-community master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/v2fly/domain-list-community.git || true
          git fetch --no-tags upstream master
          git merge --no-edit upstream/master
          git push origin master
